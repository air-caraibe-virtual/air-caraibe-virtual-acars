# Fabrique l'installateur Windows et publie la mise à jour quand le numéro de version change
name: Publier une version

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm ci
      - name: Version bêta ? (ex. 0.2.0-beta.1) publiée en pré-version, seulement pour les bêta-testeurs
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));if(p.version.includes('-')){p.build.publish[0].releaseType='prerelease';fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('Pré-version bêta',p.version)}else console.log('Version officielle',p.version)"
      - name: Fabriquer et publier l'installateur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
